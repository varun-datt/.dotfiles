# Agent Skills manifest — single source of truth for `npx skills` installs.
#
# Consumed by .chezmoitemplates/skills-install.tmpl, which the
# run_onchange_after_skills.* scripts render into `npx skills add` commands.
#
# Each source entry becomes:
#   npx skills add <repo> -s <skill> [-s <skill>...] -g -y
# Use  skills: ["*"]  to install every skill in a repo.
#
# Canonical store is ~/.agents/skills/ (symlinked into each pinned agent).
# Skills from these sources are NOT vendored into chezmoi; hand-written
# skills live in dot_agents/skills/ and are deployed by chezmoi directly.

skills:
  # Pin target agents instead of auto-detecting installed ones.
  # Auto-detection also picks up "PromptScript" (it claims the shared
  # .agents/skills/ path but is project-only), which then fails every
  # global install with "PromptScript does not support global skill
  # installation". Pinning the agents we actually use avoids that noise.
  agents:
    - github-copilot
    - cursor
  #   - claude-code

  # Upstream skills that load only when invoked by name (see README).
  explicitOnly:
    - dt-obs-problems
    - find-skills
    - receiving-code-review
    - skill-creator
    - tavily-crawl
    - tavily-map

  sources:
    # --- Skill authoring & theming ---
    - repo: anthropics/skills
      skills: [frontend-design, skill-creator, pptx]

    # --- Frontend / design / writing ---
    - repo: vercel-labs/agent-skills
      skills: [web-design-guidelines, writing-guidelines]
    - repo: blader/humanizer
      skills: [humanizer]
    - repo: pbakaus/impeccable
      skills: [impeccable]
    - repo: emilkowalski/skills
      skills: [emil-design-eng]

    # --- Skill discovery ---
    - repo: vercel-labs/skills
      skills: [find-skills]

    # --- Engineering practice: code review, debugging, verification ---
    - repo: obra/superpowers
      skills:
        - receiving-code-review
        - verification-before-completion
    #    - brainstorming
    #    - requesting-code-review
    #    - systematic-debugging
    #    - writing-plans
    #    - executing-plans

    #- repo: addyosmani/agent-skills
    #  skills: [api-and-interface-design, spec-driven-development]

    # --- Coding-agent guidelines (Karpathy-inspired) ---
    - repo: multica-ai/andrej-karpathy-skills
      skills: [karpathy-guidelines]

    # --- Alignment / grilling / handoff (Matt Pocock) ---
    - repo: mattpocock/skills
      skills: [handoff, grilling, wayfinder, domain-modeling, setup-matt-pocock-skills, diagnosing-bugs]

    # --- .NET / architecture / docs / governance (GitHub awesome-copilot) ---
